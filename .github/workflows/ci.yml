name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Shared + Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testar shared (JVM/Android) e montar androidApp
        run: ./gradlew :shared:testDebugUnitTest :androidApp:assembleDebug --stacktrace

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-android-test-results
          path: shared/build/reports/tests
          if-no-files-found: ignore

  ios:
    name: Shared (iOS Simulator) + iosApp
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native (konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Testar shared no simulador iOS
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Gerar iosApp.xcodeproj
        working-directory: iosApp
        run: xcodegen generate

      - name: Buildar iosApp para o simulador
        working-directory: iosApp
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ios-test-results
          path: shared/build/reports/tests
          if-no-files-found: ignore
